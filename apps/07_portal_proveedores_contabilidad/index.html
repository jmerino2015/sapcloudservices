<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SAP S/4HANA Portal de Proveedores — Contabilidad & Cuentas por Pagar (3-Way Matching)" />
    <title>Portal Proveedores — Contabilidad & 3-Way Match</title>

    <!-- Google Fonts & FontAwesome 6 Outline -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />

    <!-- SAPUI5 Bootstrap CDN con Fiori Horizon -->
    <script
        id="sap-ui-bootstrap"
        src="https://ui5.sap.com/resources/sap-ui-core.js"
        data-sap-ui-theme="sap_horizon"
        data-sap-ui-libs="sap.m,sap.f,sap.ui.layout,sap.ui.unified,sap.uxap,sap.suite.ui.microchart,sap.tnt"
        data-sap-ui-compatVersion="edge"
        data-sap-ui-async="true"
        data-sap-ui-frameOptions="allow"
        data-sap-ui-onInit="module:sap/ui/core/ComponentSupport"
        data-sap-ui-resourceroots='{"com.antigravity.portalProveedoresContabilidad": "./"}'
    ></script>

    <link rel="stylesheet" href="css/style.css" />
</head>
<body class="sapUiBody" id="content">
    <div
        data-sap-ui-component
        data-name="com.antigravity.portalProveedoresContabilidad"
        data-id="container"
        data-settings='{"id": "portalProveedoresContabilidad"}'
        data-handle-validation="true"
    ></div>

    <script>
        // Ocultar cabecera propia si la app corre dentro del modal iframe del portal
        if (window.self !== window.top) {
            document.body.classList.add('in-iframe');
        }

        // Listener para sincronización de tema Horizon Claro/Oscuro
        window.addEventListener('message', function(e) {
            if (e.data && e.data.type === 'SET_THEME') {
                var isDark = e.data.theme === 'dark';
                if (window.sap && sap.ui && sap.ui.getCore) {
                    try {
                        sap.ui.getCore().applyTheme(isDark ? 'sap_horizon_dark' : 'sap_horizon');
                    } catch(err) {}
                }
            }
        });
    </script>
</body>
</html>
