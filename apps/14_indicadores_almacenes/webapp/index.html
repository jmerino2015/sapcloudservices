<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Torre de Control WMS — Indicadores de Almacén Multi-Sede SAP S/4HANA & Clean Core" />
    <title>Torre de Control WMS Multi-Sede</title>

    <style>
        html, body, #content {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
    </style>

    <!-- SAPUI5 Bootstrap -->
    <script
        id="sap-ui-bootstrap"
        src="https://ui5.sap.com/resources/sap-ui-core.js"
        data-sap-ui-theme="sap_horizon"
        data-sap-ui-libs="sap.m,sap.f,sap.ui.layout,sap.suite.ui.microchart,sap.tnt"
        data-sap-ui-compatVersion="edge"
        data-sap-ui-async="true"
        data-sap-ui-frameOptions="allow"
        data-sap-ui-onInit="module:sap/ui/core/ComponentSupport"
        data-sap-ui-resourceroots='{
            "com.antigravity.indicadoresAlmacenes": "./"
        }'
    ></script>
</head>
<body class="sapUiBody sapUiSizeCompact" id="content">
    <div
        data-sap-ui-component
        data-name="com.antigravity.indicadoresAlmacenes"
        data-id="container"
        data-settings='{"id": "indicadoresAlmacenes"}'
        data-handle-validation="true"
        style="height: 100%;"
    ></div>

    <!-- Sincronización de Tema Fiori Horizon con Launchpad / Shell Padre -->
    <script>
        if (window.self !== window.top) {
            document.body.classList.add('in-iframe');
        }
        window.addEventListener('message', function(e) {
            if (e.data && e.data.type === 'SET_THEME') {
                var isDark = (e.data.theme === 'dark' || e.data.theme === 'sap_horizon_dark');
                var sTheme = isDark ? 'sap_horizon_dark' : 'sap_horizon';
                if (window.sap && sap.ui && sap.ui.getCore) {
                    try {
                        sap.ui.getCore().applyTheme(sTheme);
                    } catch(err) {
                        console.warn("No se pudo aplicar el tema dinámico:", err);
                    }
                }
            }
        });
    </script>
</body>
</html>
