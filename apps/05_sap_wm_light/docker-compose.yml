version: '3.9'

services:
  # ── PostgreSQL ─────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: wm-light-db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       wm_light
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend API ────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wm-light-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV:     production
      PORT:         3000
      DEMO_MODE:    "false"
      DB_HOST:      db
      DB_PORT:      5432
      DB_NAME:      wm_light
      DB_USER:      postgres
      DB_PASS:      postgres123
      JWT_SECRET:   CHANGE_THIS_IN_PRODUCTION_USE_LONG_RANDOM_STRING
      JWT_EXPIRES_IN: 8h
      SAP_SYNC_CRON:  "0 */6 * * *"
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: >
      sh -c "node src/models/migrate.js && node src/models/seed.js && node src/server.js"

  # ── Nginx (sirve frontend + proxy API) ────────────────────
  nginx:
    image: nginx:alpine
    container_name: wm-light-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost"]
      interval: 30s

volumes:
  pgdata:
