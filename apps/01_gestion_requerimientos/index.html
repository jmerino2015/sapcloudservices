<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="SAP Solution Manager 7.2 - Requirements Management Fiori Launchpad Demo">
    <title>SAP Fiori Launchpad — Requirements Management</title>
    <!-- FontAwesome & Inter Typography -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%23354A5F' rx='12' width='100' height='100'/><text x='50' y='65' font-size='50' text-anchor='middle' fill='white' font-family='Arial'>S</text></svg>">
</head>
<body>

    <!-- ═══ SAP Fiori Shell Header (Matches user image) ═══ -->
    <header class="sap-shell" id="sap-shell">
        <div class="shell-left">
            <div class="shell-logo-area" onclick="App.navigate('launchpad')" title="SAP Fiori">
                <svg class="sap-logo-official" viewBox="0 0 62 30" width="56" height="26">
                    <defs>
                        <linearGradient id="sapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:#00AAEF"/>
                            <stop offset="50%" style="stop-color:#0077C8"/>
                            <stop offset="100%" style="stop-color:#1661BE"/>
                        </linearGradient>
                    </defs>
                    <rect width="62" height="30" rx="4" fill="url(#sapGrad)"/>
                    <text x="31" y="21.5" text-anchor="middle" fill="#FFFFFF" font-family="'Arial Black', 'Impact', 'Arial', sans-serif" font-size="18" font-weight="900" letter-spacing="1">SAP</text>
                </svg>
            </div>
            <button class="shell-nav-home-btn" onclick="App.goHome()" title="Home">
                <i class="fas fa-chevron-left"></i>
                <span>Home</span>
            </button>
            <div class="shell-app-title">
                <span>SAP SOLUTION MANAGER 7.2 - FIORI</span>
            </div>
        </div>

        <!-- Shell Actions (Standard Fiori Icons) -->
        <div class="shell-right">
            <div class="shell-search-box">
                <input type="text" placeholder="Buscar en Launchpad..." oninput="App.filterSidebar(this.value)" />
                <i class="fas fa-search"></i>
            </div>
            <button class="shell-btn" onclick="App.showToast('Configuraciones Solution Manager')" title="Configuración">
                <i class="fas fa-gear"></i>
            </button>
            <button class="shell-btn" onclick="App.showToast('5 notificaciones de tickets y aprobaciones')" title="Notificaciones">
                <i class="fas fa-bell"></i>
                <span class="shell-bell-badge">5</span>
            </button>
            <div class="shell-avatar" title="Usuario: Consultor SolMan">
                SM
            </div>
        </div>
    </header>

    <!-- ═══ Solution Manager 7.2 Main App Wrapper with Left Sidebar ═══ -->
    <div class="solman-app-wrapper" id="solman-app-wrapper">
        
        <!-- ── Left Sidebar Navigation: Exact Fiori Standard from Image ── -->
        <aside class="solman-sidebar" id="solmanSidebar">
            <!-- Scrollable Sub-Apps Nav List -->
            <div class="sidebar-nav-scroll" id="sidebarNavScroll">
                <!-- Injected dynamically by App.renderSidebar() -->
            </div>

            <!-- Bottom Pinned Item (Administración) -->
            <div class="sidebar-fixed-bottom" id="sidebarFixedBottom">
                <div class="nav-item" onclick="App.navigate('sol-admin')" title="Administración SolMan">
                    <div class="nav-item-left">
                        <i class="fas fa-gear nav-item-icon"></i>
                        <span class="nav-item-text">Administración</span>
                    </div>
                </div>
            </div>
        </aside>

        <!-- ── Main Workspace Pane (Category Filter & Dynamic Views) ── -->
        <div class="solman-main-pane" id="solmanMainPane">
            <!-- ═══ Category Navigation Bar (Pills Filter) ═══ -->
            <nav class="category-nav" id="category-nav">
                <button class="category-tab active" data-cat="all" onclick="App.setCategory('all')">
                    <i class="fas fa-border-all sapUiTinyMarginEnd"></i> Todos los Módulos
                </button>
                <button class="category-tab" data-cat="project" onclick="App.setCategory('project')">Project and Process Management</button>
                <button class="category-tab" data-cat="itsm" onclick="App.setCategory('itsm')">IT Service Management</button>
                <button class="category-tab" data-cat="test" onclick="App.setCategory('test')">Test Suite</button>
                <button class="category-tab" data-cat="jobs" onclick="App.setCategory('jobs')">Job Management</button>
                <button class="category-tab" data-cat="engagement" onclick="App.setCategory('engagement')">SAP Engagement and Services</button>
            </nav>

            <!-- ═══ Main Content ═══ -->
            <main class="main-content" id="main-content">
                <!-- Content rendered dynamically by App.render() -->
            </main>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toast-container"></div>

    <!-- Scripts -->
    <script src="js/mockdata.js"></script>
    <script src="js/charts.js"></script>
    <script src="js/app.js"></script>
    <script>
        if (window.self !== window.top) {
            document.body.classList.add('in-iframe');
        }
        window.addEventListener('message', function(e) {
            if (e.data && e.data.type === 'SET_THEME') {
                var isDark = e.data.theme === 'dark';
                document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
                document.body.classList.toggle('dark-mode', isDark);
            }
        });
    </script>
</body>
</html>
